name: Release

# Cross-compile the ClawMast worker for every Tier 1 / Tier 2 target,
# sign the update manifest with minisign, and publish:
#
#   1. Tarballs + manifest.json + manifest.json.minisig attached to a
#      GitHub Release at
#        https://github.com/<org>/<repo>/releases/download/<tag>/…
#      (immutable per-version; this is where tarball URLs point).
#
#   2. manifest.json + manifest.json.minisig mirrored to the
#      `gh-pages` branch at
#        /stable/manifest.json
#        /stable/manifest.json.minisig
#      so clients fetching the channel-level URL
#        https://<org>.github.io/<repo>/stable/manifest.json
#      always see the latest release without a per-tag redirect.
#
# Both surfaces are signed with the production key (ID
# FD412C2F6CA2B447) whose public half is embedded in every worker via
# internal/updater/devkey.pub. The private half lives only in the
# MINISIGN_PRIVATE_KEY repository secret.
#
# Triggers: `v*` tag push (canonical release path), or manual dispatch
# for dry-run rehearsals against an existing tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build (e.g. v0.2.0). Must already exist on a commit in the repo."
        required: true

permissions:
  contents: write  # required to create a release and upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build, sign, publish
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag and channel
        id: tag
        # The channel decides two coupled things: the -channel value
        # baked into the manifest (which updater.Client enforces via
        # ErrChannelMismatch) and the gh-pages subdirectory the
        # manifest is published to. A tag containing a hyphen is a
        # SemVer pre-release (rc / beta / alpha / …) and routes to
        # `beta`; a clean vN.N.N tag routes to `stable`. Both values
        # MUST be resolved from the same expression so a drift in
        # future refactors cannot publish a manifest to /beta/ that
        # the worker will then refuse as channel-mismatch.
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            value="${GITHUB_REF#refs/tags/}"
          else
            value="${{ github.event.inputs.tag }}"
          fi
          if [[ "${value}" == *-* ]]; then
            channel="beta"
          else
            channel="stable"
          fi
          {
            echo "value=${value}"
            echo "channel=${channel}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Releasing ${value} to channel=${channel}"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.value }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Sanity — tests must pass on the tagged commit
        run: go test ./...

      - name: Build release tool
        run: go build -o bin/clawmast-release ./cmd/clawmast-release

      - name: Cross-compile worker tarballs
        env:
          TAG: ${{ steps.tag.outputs.value }}
          COMMIT: ${{ github.sha }}
        run: |
          bin/clawmast-release build \
            -out dist \
            -version "${TAG}" \
            -commit "${COMMIT::7}"
          ls -la dist

      - name: Generate manifest
        env:
          TAG: ${{ steps.tag.outputs.value }}
          CHANNEL: ${{ steps.tag.outputs.channel }}
          REPO: ${{ github.repository }}
        run: |
          bin/clawmast-release manifest \
            -dir dist \
            -out dist/manifest.json \
            -channel "${CHANNEL}" \
            -version "${TAG}" \
            -base-url "https://github.com/${REPO}/releases/download/${TAG}" \
            -notes "Automated release ${TAG}."
          cat dist/manifest.json

      - name: Sign manifest
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          if [[ -z "${MINISIGN_PRIVATE_KEY}" ]]; then
            echo "::error::MINISIGN_PRIVATE_KEY secret is not set. Generate a keypair with 'clawmast-release keygen' and store the private key in repo Settings → Secrets → Actions."
            exit 1
          fi
          keyfile=$(mktemp)
          # Write private key without a trailing newline stripping artefact.
          printf '%s' "${MINISIGN_PRIVATE_KEY}" > "${keyfile}"
          bin/clawmast-release sign \
            -key "${keyfile}" \
            -in dist/manifest.json \
            -out dist/manifest.json.minisig \
            -comment "${TAG}"
          rm -f "${keyfile}"
          ls -la dist/manifest.json*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.value, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/clawmast-*.tar.gz
            dist/manifest.json
            dist/manifest.json.minisig

      # Mirror the signed manifest to the gh-pages branch so clients
      # reach it at a channel-level URL that does not move with each
      # tag. Tarballs stay on the GitHub Release; only the small text
      # artefacts land on Pages. keep_files: true preserves any other
      # channel subdirectory (and ad-hoc files like .nojekyll) that
      # already live on gh-pages.
      - name: Stage channel content for gh-pages
        env:
          CHANNEL: ${{ steps.tag.outputs.channel }}
        run: |
          mkdir -p "channel-stage/${CHANNEL}"
          cp dist/manifest.json dist/manifest.json.minisig "channel-stage/${CHANNEL}/"
          ls -la "channel-stage/${CHANNEL}"

      - name: Publish manifest to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: channel-stage
          keep_files: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "publish ${{ steps.tag.outputs.value }} manifest to ${{ steps.tag.outputs.channel }} channel"
